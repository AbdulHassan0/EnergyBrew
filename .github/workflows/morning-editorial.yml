name: EnergyBrew morning newsletter editorial draft (unapproved)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "newsletter.py"
      - "pilot_audit.py"
      - "brief_compiler.py"
      - "newsletter/briefs/**"
      - "newsletter/pilots/**"
      - "newsletter/EDITORIAL.md"
      - ".github/workflows/morning-editorial.yml"
  schedule:
    # 06:45 Chicago, after 06:30 collection cutoff and 06:38 research.
    # GitHub can delay cron; this is not an on-time newsletter guarantee.
    - cron: "45 11,12 * * 1-5"

permissions:
  contents: read

jobs:
  prepare-private-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the Chicago-time morning window
        id: window
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/Chicago"))
          active = now.hour == 6 and 40 <= now.minute < 55
          print("run=" + ("yes" if os.environ.get("GITHUB_EVENT_NAME") in ("workflow_dispatch", "push") or active else "no"))
          PY
      - name: Run focused pilot editorial QA; complete suite runs on code pushes
        if: steps.window.outputs.run == 'yes'
        run: |
          python -m unittest discover -s tests -p "test_newsletter.py" -q
          python -m unittest discover -s tests -p "test_pilot_audit.py" -q
          python -m unittest discover -s tests -p "test_workflow_separation.py" -q
      - name: Retrieve current private research desk
        if: steps.window.outputs.run == 'yes'
        run: |
          mkdir -p latest-state
          git fetch --no-tags origin collector-state
          git show FETCH_HEAD:state/desk_latest.json > latest-state/desk_latest.json
          # Audit against complete saved source history, not just a ranked
          # 32-story desk which may omit otherwise legitimate publisher links.
          for file in articles.json discovery.json press_releases.json; do
            git show "FETCH_HEAD:state/$file" > "latest-state/$file"
          done
      - name: Preserve collected source headlines for the editor
        if: steps.window.outputs.run == 'yes'
        run: |
          python newsletter.py prepare --desk latest-state/desk_latest.json --out output/newsletter/review_queue.json
      - name: Render fully written pilot email when today's curated issue exists
        if: steps.window.outputs.run == 'yes'
        run: |
          # Source summaries are authored from publisher articles, not from
          # headline-only templates. Do not make placeholder emails for dates
          # without content.
          TODAY="$(TZ=America/Chicago date +%F)"
          PILOT=""
          if test -f "newsletter/briefs/${TODAY}.json"; then
            # Compile only source-backed, already-authored briefs.
            python brief_compiler.py --desk latest-state/desk_latest.json --briefs "newsletter/briefs/${TODAY}.json" --rss latest-state/articles.json --discovery latest-state/discovery.json --releases latest-state/press_releases.json --out output/newsletter/COMPILED_PILOT.json
            PILOT=output/newsletter/COMPILED_PILOT.json
          elif test -f "newsletter/pilots/${TODAY}.json"; then
            PILOT="newsletter/pilots/${TODAY}.json"
          fi
          if test -n "$PILOT"; then
            python pilot_audit.py --pilot "$PILOT" --desk latest-state/desk_latest.json --rss latest-state/articles.json --discovery latest-state/discovery.json --releases latest-state/press_releases.json --output output/newsletter/PILOT_QUALITY_REPORT.json
            python newsletter.py pilot-preview --edition "$PILOT" --html output/newsletter/PILOT_email_preview.html --text output/newsletter/PILOT_email_preview.txt
            sed -n '1,38p' output/newsletter/PILOT_QUALITY_REPORT.md >> "$GITHUB_STEP_SUMMARY"
            echo "PILOT preview generated with complete copy; NO email sent." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No source-backed complete brief bank for ${TODAY}; research queue only, no fake summaries." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive unapproved draft; NEVER email or publish
        if: steps.window.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: energybrew-editorial-draft-unapproved
          path: output/newsletter/
          retention-days: 7
