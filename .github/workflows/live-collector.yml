name: EnergyBrew live RSS collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "public_collector_guard.py"
      - "editorial.py"
      - "discovery.py"
      - "newsroom_health.py"
      - "gal.py"
      - "press_releases.py"
      - "research_desk.py"
      - "ops_metrics.py"
      - "tests/**"
      - ".github/workflows/live-collector.yml"
  schedule:
    - cron: "17 4,10,16,22 * * *"
permissions:
  contents: write
concurrency:
  group: energybrew-live-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests before live collection
        run: python -m unittest discover -s tests -v
      - name: Restore state from dedicated branch
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin collector-state >/dev/null 2>&1; then
            git fetch --no-tags origin collector-state
            # Missing files on a fresh deployment must stay absent, not become
            # zero-byte files (which the collectors correctly reject as corrupt).
            if git cat-file -e FETCH_HEAD:state/articles.json 2>/dev/null; then
              git show FETCH_HEAD:state/articles.json > state/articles.json
            fi
            if git cat-file -e FETCH_HEAD:state/discovery.json 2>/dev/null; then
              git show FETCH_HEAD:state/discovery.json > state/discovery.json
            fi
            if git cat-file -e FETCH_HEAD:state/press_releases.json 2>/dev/null; then
              git show FETCH_HEAD:state/press_releases.json > state/press_releases.json
            fi
          fi
      - name: Fetch actual publisher-dated RSS stories
        id: ingest
        continue-on-error: true
        run: python collector.py --state state/articles.json --output output/collector --hours 48
      - name: Search broader global energy coverage (unverified leads only)
        id: discovery
        continue-on-error: true
        run: python discovery.py --state state/discovery.json --output output/discovery --max-queries 4
      - name: Capture supplemental GDELT GAL RSS research sample
        id: gal
        continue-on-error: true
        run: python gal.py --state state/discovery.json --output output/gal
      - name: Collect energy company announcement leads (not independent reporting)
        id: releasefeed
        continue-on-error: true
        run: python press_releases.py --state state/press_releases.json --output output/releases
      - name: Assemble unified private research desk
        if: always()
        run: python research_desk.py --rss-state state/articles.json --discovery-state state/discovery.json --releases-state state/press_releases.json --output output/desk
      - name: Produce seven-day reliability and volume scorecard
        if: always()
        run: python ops_metrics.py --rss state/articles.json --discovery state/discovery.json --releases state/press_releases.json --output output/operations
      - name: Audit news coverage and collection gaps
        if: always()
        run: |
          python newsroom_health.py --rss-state state/articles.json --rss-run output/collector/latest.json --discovery-state state/discovery.json --discovery-run output/discovery/latest.json --releases-state state/press_releases.json --releases-run output/releases/latest.json --output output/health
      - name: Validate public-source metadata before state persistence
        id: metadata_guard
        if: always()
        run: python public_collector_guard.py --sanitize-legacy --rss state/articles.json --discovery state/discovery.json --releases state/press_releases.json
      - name: Publish run summary and artifact
        if: always()
        run: |
          if test -f output/collector/latest.md; then
            cat output/collector/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Collection report was not produced" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Discovery step outcome: ${{ steps.discovery.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if test -f output/discovery/latest.md; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat output/discovery/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Discovery report missing; no verified GDELT findings" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "GAL sampled-feed outcome: ${{ steps.gal.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if test -f output/gal/latest.md; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat output/gal/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Company-announcement feed outcome: ${{ steps.releasefeed.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if test -f output/releases/latest.md; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat output/releases/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f output/operations/metrics.md; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat output/operations/metrics.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f output/desk/desk.md; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat output/desk/desk.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f output/health/health.md; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat output/health/health.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: energybrew-news-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/collector/
            output/discovery/
            output/health/
            output/gal/
            output/releases/
            output/desk/
            output/operations/
          if-no-files-found: warn
          retention-days: 30
      - name: Save collector state in isolated branch
        if: steps.metadata_guard.outcome == 'success'
        run: |
          if test ! -s state/articles.json; then
            echo "No state file to persist."
            exit 0
          fi
          export STATE_DIR="$RUNNER_TEMP/energybrew-state"
          if git ls-remote --exit-code --heads origin collector-state >/dev/null 2>&1; then
            git fetch --no-tags origin collector-state
            git worktree add --detach "$STATE_DIR" FETCH_HEAD
            cd "$STATE_DIR"
            git switch -c "update-${GITHUB_RUN_ID}"
          else
            git worktree add --detach "$STATE_DIR" HEAD
            cd "$STATE_DIR"
            git switch --orphan collector-state
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p state
          cp "$GITHUB_WORKSPACE/state/articles.json" state/articles.json
          if test -f "$GITHUB_WORKSPACE/output/collector/latest.json"; then
            cp "$GITHUB_WORKSPACE/output/collector/latest.json" state/latest.json
            cp "$GITHUB_WORKSPACE/output/collector/latest.md" state/latest.md
            for report in volume_7d.json editorial_candidates.json editorial_candidates_24h.json regulatory_watch.json; do
              if test -f "$GITHUB_WORKSPACE/output/collector/$report"; then
                cp "$GITHUB_WORKSPACE/output/collector/$report" "state/$report"
              fi
            done
          fi
          if test -s "$GITHUB_WORKSPACE/state/discovery.json"; then
            cp "$GITHUB_WORKSPACE/state/discovery.json" state/discovery.json
          fi
          if test -f "$GITHUB_WORKSPACE/output/discovery/latest.json"; then
            cp "$GITHUB_WORKSPACE/output/discovery/latest.json" state/discovery_latest.json
            cp "$GITHUB_WORKSPACE/output/discovery/latest.md" state/discovery_latest.md
            for report in leads_24h.json leads_7d.json; do
              if test -f "$GITHUB_WORKSPACE/output/discovery/$report"; then
                cp "$GITHUB_WORKSPACE/output/discovery/$report" "state/discovery_$report"
              fi
            done
          fi
          if test -f "$GITHUB_WORKSPACE/output/gal/latest.json"; then
            cp "$GITHUB_WORKSPACE/output/gal/latest.json" state/gal_latest.json
            cp "$GITHUB_WORKSPACE/output/gal/latest.md" state/gal_latest.md
            for report in leads_24h.json leads_7d.json; do
              if test -f "$GITHUB_WORKSPACE/output/gal/$report"; then
                cp "$GITHUB_WORKSPACE/output/gal/$report" "state/research_$report"
              fi
            done
          fi
          if test -f "$GITHUB_WORKSPACE/output/health/health.json"; then
            cp "$GITHUB_WORKSPACE/output/health/health.json" state/health_latest.json
            cp "$GITHUB_WORKSPACE/output/health/health.md" state/health_latest.md
          fi
          if test -s "$GITHUB_WORKSPACE/state/press_releases.json"; then
            cp "$GITHUB_WORKSPACE/state/press_releases.json" state/press_releases.json
          fi
          if test -f "$GITHUB_WORKSPACE/output/releases/latest.json"; then
            cp "$GITHUB_WORKSPACE/output/releases/latest.json" state/releases_latest.json
            cp "$GITHUB_WORKSPACE/output/releases/latest.md" state/releases_latest.md
            cp "$GITHUB_WORKSPACE/output/releases/leads_24h.json" state/releases_leads_24h.json
            cp "$GITHUB_WORKSPACE/output/releases/leads_7d.json" state/releases_leads_7d.json
          fi
          if test -f "$GITHUB_WORKSPACE/output/desk/desk.json"; then
            cp "$GITHUB_WORKSPACE/output/desk/desk.json" state/desk_latest.json
            cp "$GITHUB_WORKSPACE/output/desk/desk.md" state/desk_latest.md
          fi
          if test -f "$GITHUB_WORKSPACE/output/operations/metrics.json"; then
            cp "$GITHUB_WORKSPACE/output/operations/metrics.json" state/metrics_latest.json
            cp "$GITHUB_WORKSPACE/output/operations/metrics.md" state/metrics_latest.md
          fi
          git config user.name "EnergyBrew collector"
          git config user.email "energybrew-bot@users.noreply.github.com"
          git add -f state/
          git diff --cached --quiet || {
            git commit -m "Record independent live collection ${GITHUB_RUN_ID}"
            git push origin HEAD:collector-state
          }
      - name: Mark absence of live source connection as a failure
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "No successful live RSS response; see run artifact for diagnostics." >&2
          exit 1
