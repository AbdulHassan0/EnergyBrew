name: EnergyBrew hourly discovery backup

on:
  workflow_dispatch:
  schedule:
    - cron: "45 * * * *"

permissions:
  contents: write

# A shared lock serializes the hourly writer with the full daily RSS workflow.
# Both persist their separate state in the same collector-state branch.
concurrency:
  group: energybrew-live-collector
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate GAL collector before live sampling
        run: python -m unittest discover -s tests -p "test_gal.py" -v
      - name: Restore previous discovery history
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin collector-state >/dev/null 2>&1; then
            git fetch --no-tags origin collector-state
            for prior in discovery.json articles.json latest.json discovery_latest.json press_releases.json releases_latest.json; do
              if git cat-file -e "FETCH_HEAD:state/$prior" 2>/dev/null; then
                git show "FETCH_HEAD:state/$prior" > "state/$prior"
              fi
            done
          fi
      - name: Sample live GAL publisher-link index
        id: sample
        continue-on-error: true
        run: python gal.py --state state/discovery.json --output output/gal
      - name: Audit live coverage after the new sample
        if: always()
        run: |
          python newsroom_health.py --rss-state state/articles.json --rss-run state/latest.json --discovery-state state/discovery.json --discovery-run state/discovery_latest.json --releases-state state/press_releases.json --releases-run state/releases_latest.json --output output/health
      - name: Report result
        if: always()
        run: |
          if test -s output/gal/latest.md; then
            cat output/gal/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No GAL report generated; check job logs" >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -s output/health/health.md; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat output/health/health.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify public metadata before branch update
        id: metadata_guard
        if: always()
        run: python public_collector_guard.py --sanitize-legacy --rss state/articles.json --discovery state/discovery.json --releases state/press_releases.json
      - name: Persist hourly discovery history
        if: steps.metadata_guard.outcome == 'success'
        run: |
          if test ! -s state/discovery.json; then
            echo "No valid discovery history to persist"
            exit 0
          fi
          export STATE_DIR="$RUNNER_TEMP/energybrew-hourly-state"
          if git ls-remote --exit-code --heads origin collector-state >/dev/null 2>&1; then
            git fetch --no-tags origin collector-state
            git worktree add --detach "$STATE_DIR" FETCH_HEAD
            cd "$STATE_DIR"
            git switch -c "gal-${GITHUB_RUN_ID}"
          else
            git worktree add --detach "$STATE_DIR" HEAD
            cd "$STATE_DIR"
            git switch --orphan collector-state
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p state
          cp "$GITHUB_WORKSPACE/state/discovery.json" state/discovery.json
          if test -s "$GITHUB_WORKSPACE/output/gal/latest.json"; then
            cp "$GITHUB_WORKSPACE/output/gal/latest.json" state/gal_latest.json
            cp "$GITHUB_WORKSPACE/output/gal/latest.md" state/gal_latest.md
            cp "$GITHUB_WORKSPACE/output/gal/leads_24h.json" state/research_leads_24h.json
            cp "$GITHUB_WORKSPACE/output/gal/leads_7d.json" state/research_leads_7d.json
          fi
          if test -s "$GITHUB_WORKSPACE/output/health/health.json"; then
            cp "$GITHUB_WORKSPACE/output/health/health.json" state/health_latest.json
            cp "$GITHUB_WORKSPACE/output/health/health.md" state/health_latest.md
          fi
          git config user.name "EnergyBrew discovery"
          git config user.email "energybrew-bot@users.noreply.github.com"
          git add -f state/
          git diff --cached --quiet || {
            git commit -m "Sample GAL RSS discovery ${GITHUB_RUN_ID}"
            git push origin HEAD:collector-state
          }
      - name: Fail visibly if discovery source failed
        if: steps.sample.outcome == 'failure'
        run: |
          echo "GAL sampling failed; see persisted status and job logs" >&2
          exit 1
