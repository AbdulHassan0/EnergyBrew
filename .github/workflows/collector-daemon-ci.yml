name: EnergyBrew standalone collector build validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # The local worker imports these shared news engines. Changes to any
      # ingestion or timing primitive must trigger both Windows and Linux.
      - "collector.py"
      - "gal.py"
      - "discovery.py"
      - "press_releases.py"
      - "public_collector_guard.py"
      - "research_desk.py"
      - "coverage_windows.py"
      - "ops_metrics.py"
      - "editorial.py"
      - "collector_daemon.py"
      - "host_rss_refresh.py"
      - "rss_fetch_pool.py"
      - "portable_lock.py"
      - "tests/test_windows_local_news_ci.py"
      - "deploy/windows/run-energybrew-news.ps1"
      - "deploy/windows/install-news-task.ps1"
      - "host_release_refresh.py"
      - "render_worker.py"
      - "render_entrypoint.py"
      - "Dockerfile.collector"
      - "Dockerfile.render"
      - "render.yaml"
      - "tests/test_collector_daemon.py"
      - "morning_host_runner.py"
      - "morning_readiness.py"
      - "tests/test_morning_host_runner.py"
      - "tests/test_host_rss_refresh.py"
      - "tests/test_rss_fetch_pool.py"
      - "tests/test_portable_lock.py"
      - "local_pilot_report.py"
      - "tests/test_local_pilot_report.py"
      - "tests/test_host_release_refresh.py"
      - "tests/test_render_worker.py"
      - ".github/workflows/collector-daemon-ci.yml"

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline persistent state and safety tests
        run: |
          python -m unittest discover -s tests -p "test_collector_daemon.py" -v
          python -m unittest discover -s tests -p "test_morning_host_runner.py" -v
          python -m unittest discover -s tests -p "test_morning_readiness.py" -v
          python -m unittest discover -s tests -p "test_host_rss_refresh.py" -v
          python -m unittest discover -s tests -p "test_rss_fetch_pool.py" -v
          python -m unittest discover -s tests -p "test_portable_lock.py" -v
          python -m unittest discover -s tests -p "test_local_pilot_report.py" -v
          python -m unittest discover -s tests -p "test_host_release_refresh.py" -v
          python -m unittest discover -s tests -p "test_render_worker.py" -v
      - name: Build no-dependency Python collector image
        run: docker build -f Dockerfile.collector -t energybrew-collector:test .
      - name: Build Render single-disk metadata worker
        run: docker build -f Dockerfile.render -t energybrew-render-worker:test .
      - name: Smoke test Render worker container entrypoint
        run: |
          docker image inspect energybrew-render-worker:test --format '{{json .Config.Entrypoint}}' | grep render_entrypoint.py
          mkdir -p "$RUNNER_TEMP/energybrew-test-mount"
          sudo chown root:root "$RUNNER_TEMP/energybrew-test-mount"
          docker run --rm --mount type=bind,source="$RUNNER_TEMP/energybrew-test-mount",target=/data energybrew-render-worker:test --smoke | grep '"uid": 10001'
          test "$(stat -c %u "$RUNNER_TEMP/energybrew-test-mount")" = 10001
          docker run --rm --entrypoint python energybrew-render-worker:test -c "from render_worker import JOBS; from public_collector_guard import ensure_sources_public; ensure_sources_public(); assert len(JOBS)==4; print('Render worker imports and metadata gate OK')"
      - name: Run tests inside isolated collector image
        run: |
          docker run --rm --entrypoint python energybrew-collector:test -c "from collector_daemon import run_forever; print('EnergyBrew worker imports OK')"
          docker run --rm --entrypoint python energybrew-collector:test -c "from gal import parse_gal; from public_collector_guard import ensure_sources_public; ensure_sources_public(); print('Metadata guard and GAL parser OK')"
          docker run --rm --entrypoint python energybrew-collector:test -c "from morning_host_runner import run_morning; from zoneinfo import ZoneInfo; assert ZoneInfo('America/Chicago'); print('Morning host and Central timezone ready')"
      - name: Verify non-root user and persistent-volume configuration
        run: |
          docker image inspect energybrew-collector:test --format '{{.Config.User}}' | grep -x energybrew
          docker image inspect energybrew-collector:test --format '{{json .Config.Volumes}}' | grep /data

  windows-local-smoke:
    # GitHub-hosted standard Windows runner, not Render or paid hosting.
    # No live publisher polling, publishing, or outbound email.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Windows timezone data
        run: python -m pip install tzdata
      - name: Check Windows native collector imports and Chicago timezone
        shell: pwsh
        run: |
          python -c "from zoneinfo import ZoneInfo; from render_worker import JOBS; from portable_lock import lock_exclusive_nonblocking; assert ZoneInfo('America/Chicago'); assert len(JOBS)==4; print('Windows collector imports OK')"
      - name: Validate optional Task Scheduler installer syntax without registering anything
        shell: pwsh
        run: |
          $src = Get-Content "deploy/windows/install-news-task.ps1" -Raw
          [void][scriptblock]::Create($src)
          if ($src -notmatch "PREVIEW ONLY") { throw "Installer needs explicit opt-in" }
          if ($src -notmatch "MultipleInstances IgnoreNew") { throw "Duplicate-worker policy missing" }
          Write-Host "Windows task registration script parses; no task was registered."
      - name: Run portable file locking and scheduler tests on actual Windows
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_portable_lock.py" -v
          python -m unittest discover -s tests -p "test_render_worker.py" -v
          python -m unittest discover -s tests -p "test_local_pilot_report.py" -v
          python -m unittest discover -s tests -p "test_morning_host_runner.py" -v
          python -m unittest discover -s tests -p "test_host_rss_refresh.py" -v
          python -m unittest discover -s tests -p "test_host_release_refresh.py" -v
      - name: Confirm no subscriber delivery in local process
        run: python -c "from render_worker import worker_loop; print('Research worker available; no subscriber delivery was invoked')"
