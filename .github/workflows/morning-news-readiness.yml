name: EnergyBrew morning research readiness (NO EMAIL)
on:
  workflow_dispatch:
  schedule:
    - cron: "45 10,11 * * *" # 05:45 Chicago preview, DST-aware local gate
    - cron: "38 11,12 * * *" # 06:38 Chicago final, DST-aware local gate
permissions:
  contents: read
concurrency:
  group: energybrew-live-collector
  cancel-in-progress: false
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test morning cutoff and freshness rules
        run: python -m unittest discover -s tests -p "test_morning_readiness.py" -v
      - name: Gate 05:45 preview versus 06:30 final Central windows
        id: gate
        run: |
          python - <<'PY'
          from datetime import datetime,time
          from zoneinfo import ZoneInfo
          import os
          now=datetime.now(ZoneInfo("America/Chicago"))
          wall=now.time().replace(tzinfo=None)
          active=time(6,30)<=wall<time(6,50)
          preflight=time(5,45)<=wall<time(6,0)
          print("America/Chicago:",now.isoformat(),"final:",active,"preflight:",preflight)
          with open(os.environ["GITHUB_OUTPUT"],"a") as fp:
              fp.write("active="+("true" if active else "false")+"\n")
              fp.write("preflight="+("true" if preflight else "false")+"\n")
          PY
      - name: Restore public metadata state
        if: steps.gate.outputs.active == 'true' || steps.gate.outputs.preflight == 'true'
        run: |
          mkdir -p state
          git fetch --no-tags origin collector-state
          for name in articles.json discovery.json press_releases.json; do
            if git cat-file -e "FETCH_HEAD:state/$name" 2>/dev/null; then
              git show "FETCH_HEAD:state/$name" > "state/$name"
            fi
          done
      - name: Public-metadata safety gate
        id: guard
        if: steps.gate.outputs.active == 'true' || steps.gate.outputs.preflight == 'true'
        continue-on-error: true
        run: python public_collector_guard.py --sanitize-legacy --rss state/articles.json --discovery state/discovery.json --releases state/press_releases.json
      - name: Prepare early news research preview (never final)
        id: preview
        if: steps.gate.outputs.preflight == 'true' && steps.guard.outcome == 'success'
        continue-on-error: true
        run: python morning_readiness.py --rss state/articles.json --discovery state/discovery.json --releases state/press_releases.json --output output/morning --time-zone America/Chicago --preflight
      - name: Freeze research leads if fresh enough
        id: ready
        if: steps.gate.outputs.active == 'true' && steps.guard.outcome == 'success'
        continue-on-error: true
        run: python morning_readiness.py --rss state/articles.json --discovery state/discovery.json --releases state/press_releases.json --output output/morning --time-zone America/Chicago
      - name: Record result with no sending
        if: always()
        run: |
          echo "Research only, not approved, no email sent" >> "$GITHUB_STEP_SUMMARY"
          echo "Final gate: ${{ steps.gate.outputs.active }}, preview gate: ${{ steps.gate.outputs.preflight }}, saved metadata guard: ${{ steps.guard.outcome }}, preview: ${{ steps.preview.outcome }}, readiness: ${{ steps.ready.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Final preparation reads previously saved source state only; it NEVER polls feeds after 06:30." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.active == 'true' || steps.gate.outputs.preflight == 'true'
        with:
          name: energybrew-morning-research-${{ github.run_id }}
          path: |
            output/morning/
          retention-days: 14
      - name: Fail if morning research cannot be safely prepared
        if: steps.gate.outputs.active == 'true' && (steps.guard.outcome != 'success' || steps.ready.outcome != 'success')
        run: exit 1
      - name: Fail if preview lacks valid public state
        if: steps.gate.outputs.preflight == 'true' && (steps.guard.outcome != 'success' || steps.preview.outcome != 'success')
        run: exit 1
