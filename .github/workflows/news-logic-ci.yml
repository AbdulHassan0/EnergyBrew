name: EnergyBrew news logic CI (NO LIVE COLLECTION)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "tests/**"
      - "Dockerfile.collector"
      - "source_gap_audit.py"
      - ".github/workflows/frequent-gal.yml"
      - ".github/workflows/news-logic-ci.yml"
      - ".github/workflows/live-collector.yml"
      - ".github/workflows/frequent-gal.yml"
      - ".github/workflows/hourly-discovery.yml"
      - ".github/workflows/morning-news-readiness.yml"
      - ".github/workflows/scheduler-audit.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile news-engine modules
        run: python -m compileall -q -x '^\\./\\.git/' .
      - name: Run all offline news logic regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify public metadata source policy configuration
        run: python -c "from public_collector_guard import ensure_sources_public; ensure_sources_public(); print('Source-policy configuration valid')"
      - name: Distinguish code validation from live feed availability
        run: echo "No publisher feeds were polled by this CI workflow."
