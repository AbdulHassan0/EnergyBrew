name: EnergyBrew news logic CI (NO LIVE COLLECTION)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "tests/**"
      - "Dockerfile.collector"
      - "source_gap_audit.py"
      - ".github/workflows/frequent-gal.yml"
      - ".github/workflows/news-logic-ci.yml"
      - ".github/workflows/live-collector.yml"
      - ".github/workflows/precutoff-rss.yml"
      - ".github/workflows/frequent-gal.yml"
      - ".github/workflows/hourly-discovery.yml"
      - ".github/workflows/morning-news-readiness.yml"
      - ".github/workflows/scheduler-audit.yml"
permissions:
  contents: write
# Code pushes should validate the newest engine, not consume free runners
# replaying a large queue of obsolete intermediate commits.
concurrency:
  group: energybrew-news-logic-ci
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile news-engine modules
        id: compile
        continue-on-error: true
        run: python -m compileall -q -x '^\\./\\.git/' .
      - name: Run all offline news logic regression tests
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tests -v
      - name: Verify public metadata source policy configuration
        id: source_policy
        continue-on-error: true
        run: python -c "from public_collector_guard import ensure_sources_public; ensure_sources_public(); print('Source-policy configuration valid')"
      - name: Persist inspectable CI results separately from source history
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          POLICY_OUTCOME: ${{ steps.source_policy.outcome }}
        run: |
          mkdir -p output/news-ci
          python - <<'PY'
          import json,os
          from datetime import datetime, timezone
          from pathlib import Path
          outcomes={k:os.environ[k] for k in
                    ("COMPILE_OUTCOME","TESTS_OUTCOME","POLICY_OUTCOME")}
          data={
              "generated_utc":datetime.now(timezone.utc).isoformat(),
              "commit_sha":os.environ["GITHUB_SHA"],
              "run_id":os.environ["GITHUB_RUN_ID"],
              "status":"passed" if all(x=="success" for x in outcomes.values()) else "failed",
              "steps":outcomes,
              "network_source_polls":False,
              "warning":"Offline code tests only; not proof that publisher feeds are reachable."
          }
          Path("output/news-ci/latest.json").write_text(
              json.dumps(data,indent=2)+"\\n",encoding="utf-8")
          print(json.dumps(data,indent=2))
          PY
          STATE_DIR="$RUNNER_TEMP/energybrew-ci-evidence"
          if git ls-remote --exit-code --heads origin ci-evidence >/dev/null 2>&1; then
            git fetch --no-tags origin ci-evidence
            git worktree add --detach "$STATE_DIR" FETCH_HEAD
            cd "$STATE_DIR"
            git switch -c "ci-record-$GITHUB_RUN_ID"
          else
            git worktree add --detach "$STATE_DIR" HEAD
            cd "$STATE_DIR"
            git switch --orphan ci-evidence
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p state
          cp "$GITHUB_WORKSPACE/output/news-ci/latest.json" state/news_logic_latest.json
          git config user.name "EnergyBrew news CI"
          git config user.email "energybrew-bot@users.noreply.github.com"
          git add -f state/news_logic_latest.json
          git commit -m "Record news logic CI result $GITHUB_RUN_ID"
          git push origin HEAD:ci-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: energybrew-ci-evidence-${{ github.run_id }}
          path: output/news-ci/latest.json
          retention-days: 14
          if-no-files-found: warn
      - name: Report genuine code validation failure
        if: steps.compile.outcome != 'success' || steps.tests.outcome != 'success' || steps.source_policy.outcome != 'success'
        run: exit 1
      - name: Distinguish code validation from live feed availability
        run: echo "No publisher feeds were polled by this CI workflow."
